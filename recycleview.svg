<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!-- recycleview -->
<svg version="1.1" viewBox="0 0 170 100" xmlns="http://www.w3.org/2000/svg">

  <symbol id="view" viewBox="0 0 170 100">
    <rect x="1" y="1" width="20" height="10" fill="none" stroke="green" stroke-width="1"/>
    <text x="3" y="8" font-size="5" fill="white">ビュー</text>
  </symbol>

  <symbol id="data" viewBox="0 0 170 100">
    <rect x="1" y="1" width="15" height="10" fill="none" stroke="green" stroke-width="1"/>
    <text x="3" y="8" font-size="5" fill="white">data</text>
  </symbol>

  <symbol id="ya" viewBox="0 0 170 100">
    <polyline points="4,0 0,3 20,3" fill="none" stroke="white" stroke-width="1" stroke-dasharray="2,1"/>
  </symbol>

  <rect x="1" y="1" width="168" height="98" fill="none" stroke="white" stroke-width="1"/>
  <text x="5" y="6" font-size="5" fill="white">RecycleView</text>

  <rect x="5" y="10" width="90" height="85" fill="none" stroke="white" stroke-width="1"/>
  <text x="10" y="15" font-size="5" fill="white">RecycleLayout</text>

  <rect x="10" y="20" width="80" height="40" fill="none" stroke="blue" stroke-width="1"/>
  <text x="15" y="25" font-size="5" fill="white">view port</text>


  <use href="#view" x="15" y="30"/>
  <use href="#view" x="15" y="45"/>
  <use href="#view" x="15" y="63"/>

  <use href="#view" x="40" y="30"/>
  <use href="#view" x="40" y="45"/>
  <use href="#view" x="40" y="63"/>

  <use href="#view" x="65" y="30"/>
  <use href="#view" x="65" y="45"/>
  <use href="#view" x="65" y="63"/>

  <polyline points="10,70 10,80 90,80 90,70" fill="none" stroke="green" stroke-width="1"/>
  <text x="8" y="86" font-size="5" fill="white">レイアウト[例：RecycleGridLayout]</text>

  <use href="#ya" x="85" y="35"/>

  <rect x="105" y="20" width="60" height="60" fill="none" stroke="white" stroke-width="1"/>
  <text x="110" y="25" font-size="5" fill="white">RecycleDataModel</text>

  <use href="#data" x="107" y="30"/>
  <use href="#data" x="126" y="30"/>
  <use href="#data" x="145" y="30"/>

  <use href="#data" x="107" y="45"/>
  <use href="#data" x="126" y="45"/>
  <use href="#data" x="145" y="45"/>

  <use href="#data" x="107" y="63"/>
  <use href="#data" x="126" y="63"/>
  <use href="#data" x="145" y="63"/>

  <text x="115" y="90" font-size="5" fill="white">data = {key : value}</text>

</svg>